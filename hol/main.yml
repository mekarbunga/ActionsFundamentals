
# GitHub Actions Demo workflow
name: GitHub Actions Demo

on:
  push:
    branches: [ main ]
    paths-ignore: [ '.github/**' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 6 * * 0'   # Every Sunday at 06:15 UTC
  workflow_dispatch: {}

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger & ref
        run: |
          echo "🎉 The job was triggered by event: ${{ github.event_name }}"
          echo "🔎 The repository is: ${{ github.repository }}"
          echo "🔎 The workflow ref is: ${{ github.ref }}"

      - name: Checkout repository
        uses: actions/checkout@v3.3.0

      - name: List files in the repository
        run: |
          echo "The repository ${{ github.repository }} contains the following files:"
          # Prefer tree if available, fall back to ls
          if command -v tree >/dev/null 2>&1; then
            tree -a
          else
            ls -la
          fi
